<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance Alert SMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        :root {
            --primary: #4338ca;
            --primary-dark: #312e81;
            --secondary: #f97316;
            --success: #10b981;
            --danger: #ef4444;
            --info: #0ea5e9;
            --neutral-50: #f8fafc;
            --neutral-900: #0f172a;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, rgba(67, 56, 202, 0.4), transparent 40%),
                        radial-gradient(circle at 80% 0%, rgba(249, 115, 22, 0.35), transparent 35%),
                        #0f172a;
            font-family: 'Space Grotesk', 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: var(--neutral-900);
            padding: 1.5rem;
        }

        #showComplaintDataModal {
            display: block;
            position: relative;
        }

        #showComplaintDataModal .modal-dialog {
            max-width: 540px;
            margin: 0;
        }

        #showComplaintDataModal .modal-content {
            border: none;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.97), rgba(245, 243, 255, 0.92));
            box-shadow: 0 35px 80px rgba(15, 23, 42, 0.5);
            overflow: hidden;
        }

        #showComplaintDataModal .modal-header {
            background: linear-gradient(135deg, #1f2963 0%, #4338ca 45%, #4f46e5 70%, #22d3ee 100%);
            color: #fff;
            border-bottom: none;
            padding: 1.25rem 1.5rem;
        }

        #showComplaintDataModal .modal-title {
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        #showComplaintDataModal .btn-close {
            filter: brightness(0) invert(1);
        }

        #showComplaintDataModal .modal-body {
            padding: 1.75rem;
            background: var(--neutral-50);
        }

        .alert-card {
            background: #fff;
            border-radius: 18px;
            padding: 1.25rem;
            border: 1px solid rgba(15, 23, 42, 0.08);
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        .alert-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(67, 56, 202, 0.05), rgba(14, 165, 233, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .alert-card:hover::after {
            opacity: 1;
        }

        .alert-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary);
            font-size: 1.3rem;
        }

        .alert-card strong {
            color: var(--neutral-900);
        }

        .metric-line {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.035);
            margin-top: 0.75rem;
            border: 1px dashed rgba(67, 56, 202, 0.2);
        }

        .metric-line span {
            font-weight: 600;
        }

        #lblbalanceAmt {
            color: var(--success) !important;
            font-size: 1.1rem;
        }

        #lbllastsmsdate {
            color: var(--info) !important;
        }

        #lblsmscount {
            color: var(--danger) !important;
            font-size: 1rem;
        }

        #showComplaintDataModal .modal-footer {
            border: none;
            padding: 1.5rem;
            background: #fff;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        #btnSendsms {
            min-width: 160px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(120deg, #34d399, #10b981);
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #btnSendsms:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 25px rgba(16, 185, 129, 0.35);
        }

        .btn-secondary {
            min-width: 140px;
            border-radius: 999px;
            background: linear-gradient(120deg, rgba(15, 23, 42, 0.75), rgba(71, 85, 105, 0.9));
            border: none;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }
    </style>
</head>
<body>
<div class="modal" id="showComplaintDataModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title">Balance Alert SMS</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="alert-card">
                    <div class="d-flex align-items-center gap-3">
                        <div class="alert-icon">
                            <span>₹</span>
                        </div>
                        <div>
                            <p class="mb-1">This property has an outstanding balance of</p>
                            <div class="metric-line mb-0">
                                <span id="lblbalanceAmt" class="fw-bold text-success">12,450</span>
                                <span class="text-muted">₹ pending</span>
                                <span class="status-pill">Action Needed</span>
                            </div>
                            <small class="text-muted">You cannot approve this transfer mutation while dues exist.</small>
                        </div>
                    </div>
                </div>
                <div class="alert-card">
                    <p class="mb-2">The last SMS was sent on <span id="lbllastsmsdate" class="fw-bold text-primary">03 Nov 2024</span>.</p>
                    <div class="metric-line">
                        <span id="lblsmscount" class="fw-bold text-danger">2</span>
                        <span class="text-muted">messages already sent</span>
                    </div>
                    <small class="text-muted">Consider waiting 24 hours between reminders to avoid spam complaints.</small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="btnSendsms" class="btn btn-success">Send SMS</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
